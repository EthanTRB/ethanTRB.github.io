<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
  Name: Ethan Bascombe
  File: index.html
  Date: 29 July 2026
  Description: A webpage that generates a random silly story.
  -->

  <title>Silly Story Generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Silly Story Generator</h1>

    <div>
      <label for="custom-name">Enter custom name:</label>
      <input id="custom-name" type="text" placeholder="">
    </div>

    <fieldset>
      <legend>Choose locale:</legend>

      <label for="us">US</label>
      <input id="us" type="radio" name="uk-us" value="us" checked>

      <label for="uk">UK</label>
      <input id="uk" type="radio" name="uk-us" value="uk">
    </fieldset>

    <div>
      <button class="generate" type="button">Generate random story</button>
    </div>

    <!-- Thanks a lot to Willy Aguirre for his help with the code for this assessment -->

    <p class="story"></p>
  </main>

  <script src="main.js"></script>
</body>
</html>
